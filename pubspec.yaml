name: inf_orc_kit
description: "A Flutter FFI plugin for OCR with Edge AI. Uses Apple Vision (iOS) / ML Kit (Android) for text recognition and ONNX Runtime for layout detection."
version: 1.2.0
homepage: https://github.com/aruninf/inf_orc_kit
repository: https://github.com/aruninf/inf_orc_kit
issue_tracker: https://github.com/aruninf/inf_orc_kit/issues

environment:
  sdk: ^3.7.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3
  image: ^4.10.1

dev_dependencies:
  ffigen: ^13.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.aruninf.inf_orc_kit
        pluginClass: FlutterOcrKitPlugin
      ios:
        ffiPlugin: true

topics:
  - ocr
  - ml
  - vision
  - scanner
  - document
